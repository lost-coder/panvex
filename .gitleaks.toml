# gitleaks configuration. Inherits the default ruleset from gitleaks
# itself and adds a project-scoped allowlist for synthetic test
# fixtures that gitleaks reasonably confuses with real credentials.
#
# Anything outside the listed paths is still scanned with the full
# default ruleset, so a real leak in production code will still fail
# CI.

[extend]
useDefault = true

[allowlist]
description = "Allow synthetic credentials in test fixtures, storybook examples, and generated files"
paths = [
  '''(^|/).*_test\.go$''',
  '''(^|/).*\.test\.(ts|tsx|js|jsx)$''',
  '''(^|/).*\.stories\.(ts|tsx|js|jsx)$''',
  # Generated files are never where a human commits a real secret, and
  # tools like oapi-codegen embed the whole OpenAPI spec as a base64/gzip
  # blob (openapi/panvex.gen.go's `swaggerSpec`) whose high-entropy chunks
  # trip gitleaks' generic-api-key rule on every regeneration. Scan the
  # hand-written source, not the codegen output.
  '''(^|/).*\.gen\.(go|ts|tsx|json)$''',
]
