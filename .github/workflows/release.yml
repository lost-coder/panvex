name: Release

on:
  push:
    tags:
      - 'control-plane/v*'
      - 'agent/v*'

permissions:
  # Release trust model is TLS + SHA-256 only (integrity, not authenticity)
  # by owner decision (PVX-007, accepted risk) — no signing/attestation
  # permissions are needed.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      # Phase 4 inlined @lost-coder/panvex-ui into web/src/ui/, so the
      # release build no longer clones the side-repo or symlinks ../ui.

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: '1.26'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'

      - name: Determine component from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          COMPONENT="${TAG%%/*}"
          VERSION="${TAG#*/}"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build frontend (control-plane only)
        if: steps.meta.outputs.component == 'control-plane'
        run: |
          cd web && npm ci && npm run build:embed

      # ba6aadc moved the canonical install-agent.sh to deploy/ and .gitignored
      # the server-package mirror that //go:embed references. Without this step
      # `go build` fails with "pattern install_agent.sh: no matching files
      # found". Mirrors the same generate invocation used across ci.yml.
      - name: Generate embedded install-agent.sh mirror
        run: go generate ./internal/controlplane/server/...

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          COMPONENT: ${{ steps.meta.outputs.component }}
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          BINARY="panvex-${COMPONENT}-linux-${GOARCH}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORT_SHA="${COMMIT_SHA::8}"
          if [ "$COMPONENT" = "control-plane" ]; then
            go build -tags embeddedui \
              -ldflags "-X main.Version=${VERSION} -X main.CommitSHA=${SHORT_SHA} -X main.BuildTime=${BUILD_TIME}" \
              -o "${BINARY}" ./cmd/control-plane
          else
            go build \
              -ldflags "-X main.AgentVersion=${VERSION} -X main.CommitSHA=${SHORT_SHA} -X main.BuildTime=${BUILD_TIME}" \
              -o "${BINARY}" ./cmd/agent
          fi
          ARCHIVE="${BINARY}.tar.gz"
          tar czf "${ARCHIVE}" "${BINARY}"
          sha256sum "${ARCHIVE}" | awk '{print $1}' > "${ARCHIVE}.sha256"
          rm "${BINARY}"

      # Generate a CycloneDX JSON SBOM for each release archive so downstream
      # consumers can audit the exact module tree shipped in the binary.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: panvex-${{ steps.meta.outputs.component }}-linux-${{ matrix.arch }}.sbom.json
          output-file: panvex-${{ steps.meta.outputs.component }}-linux-${{ matrix.arch }}.sbom.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            panvex-*-linux-${{ matrix.arch }}.tar.gz
            panvex-*-linux-${{ matrix.arch }}.tar.gz.sha256
            panvex-*-linux-${{ matrix.arch }}.sbom.json
          generate_release_notes: true
