        address: { type: string }
        healthy: { type: boolean }
        fails: { type: integer }
        effective_latency_ms: { type: number, format: double }
        weight: { type: integer }
        last_check_age_secs: { type: integer }
        scopes:
          type: array
          items: { type: string }

    RuntimeSystemLoad:
      type: object
      required:
        - cpu_usage_pct
        - memory_used_bytes
        - memory_total_bytes
        - memory_usage_pct
        - disk_used_bytes
        - disk_total_bytes
        - disk_usage_pct
        - load_1m
        - load_5m
        - load_15m
        - net_bytes_sent
        - net_bytes_recv
      properties:
        cpu_usage_pct: { type: number, format: double }
        memory_used_bytes: { type: integer, format: int64, minimum: 0 }
        memory_total_bytes: { type: integer, format: int64, minimum: 0 }
        memory_usage_pct: { type: number, format: double }
        disk_used_bytes: { type: integer, format: int64, minimum: 0 }
        disk_total_bytes: { type: integer, format: int64, minimum: 0 }
        disk_usage_pct: { type: number, format: double }
        load_1m: { type: number, format: double }
        load_5m: { type: number, format: double }
        load_15m: { type: number, format: double }
        net_bytes_sent: { type: integer, format: int64, minimum: 0 }
        net_bytes_recv: { type: integer, format: int64, minimum: 0 }

    RuntimeMeWritersSummary:
      type: object
      required:
        - configured_endpoints
        - available_endpoints
        - coverage_pct
        - fresh_alive_writers
        - fresh_coverage_pct
        - required_writers
        - alive_writers
      properties:
        configured_endpoints: { type: integer }
        available_endpoints: { type: integer }
        coverage_pct: { type: number, format: double }
        fresh_alive_writers: { type: integer }
        fresh_coverage_pct: { type: number, format: double }
        required_writers: { type: integer }
        alive_writers: { type: integer }

    ConnectionClassCount:
      type: object
      description: |
        One (class, total) pair from Telemt's classified bad-connection
        and handshake-failure counters. Mirrors the Go
        `ConnectionClassCount` presentation type.
      required: [class, total]
      properties:
        class: { type: string }
        total: { type: integer, format: int64, minimum: 0 }

    RuntimeTopByConnections:
      type: object
      required: [username, connections]
      properties:
        username: { type: string }
        connections: { type: integer }

    RuntimeTopByThroughput:
      type: object
      required: [username, throughput_bytes]
      properties:
        username: { type: string }
        throughput_bytes: { type: integer, format: int64, minimum: 0 }

    AgentCertificateRecoveryGrant:
      type: object
      description: Lifecycle snapshot of a single recovery grant.
      required:
        - agent_id
        - status
        - issued_at_unix
        - expires_at_unix
      properties:
        agent_id: { type: string }
        status:
          type: string
          enum: [allowed, expired, used, revoked]
        issued_at_unix: { type: integer, format: int64 }
        expires_at_unix: { type: integer, format: int64 }
        used_at_unix:
          type: integer
          format: int64
          nullable: true
        revoked_at_unix:
          type: integer
          format: int64
          nullable: true

    TelemtUpdateProbe:
      type: object
      description: |
        Result of the agent probing its local process supervisor
        (systemd, OpenRC/procd, runit, docker, or none) once at startup,
        used by the panel to decide whether an in-place telemt update is
        safe to offer for this node.
      required:
        - mode
        - suggested_restart_spec
        - binary_path
        - available
        - reason
      properties:
        mode:
          type: string
          description: |
            "binary" (a supported supervisor owns telemt; a binary swap +
            supervised restart is safe), "docker" (telemt runs in a
            container; updates must go through the image), or "none"
            (nothing detected).
        suggested_restart_spec:
          type: string
          description: |
            telemtrestart spec ("systemd:telemt", "openrc:telemt",
            "procd:telemt", "runit:telemt") to use for the supervised
            restart after a binary swap. Empty when mode != "binary".
        binary_path:
          type: string
          description: |
            Best-effort resolved path to the telemt executable, used as
            the swap target. May be empty if it could not be resolved.
        available:
          type: boolean
          description: Whether an in-place update is offered at all.
        reason:
          type: string
          description: |
            Localizable CODE (not a human-readable phrase) explaining why
            available is false, e.g. "docker_only",
            "no_service_manager_detected". Empty when available is true.

    TelemtUpdateStrategy:
      type: object
      description: |
        Operator-configured strategy for how `telemt.update` jobs apply on
        one agent. Persisted; distinct from TelemtUpdateProbe, which is the
        agent's own live-detected capability. `restart_spec` and
        `binary_path` are only meaningful (and required) for `mode: binary`.
      required:
        - mode
        - restart_spec
        - binary_path
        - asset_flavor
      properties:
        mode:
          type: string
          enum: [binary, docker, none]
          description: |
            "binary" (a supported supervisor owns telemt; a binary swap +
            supervised restart is safe), "docker" (telemt runs in a
            container; updates must go through the image), or "none" (no
            in-place update path).
        restart_spec:
          type: string
          description: |
            telemtrestart spec ("systemd:telemt", "openrc:telemt",
            "procd:telemt", "runit:telemt", "command:...") to use for the
            supervised restart after a binary swap. Required for
            mode=binary; validated with the same rules the agent applies.
        binary_path:
          type: string
          description: |
            Absolute path to the telemt executable, used as the swap
            target. Required for mode=binary.
        asset_flavor:
          type: string
          description: |
            Release-asset variant to download for this agent, e.g. "v3"
            for a CPU-feature-optimised build. Empty selects the default
            asset.

    TelemtUpdateStrategyResponse:
      type: object
      description: |
        Response of `GET /api/agents/{id}/telemt/update-strategy`: the
        persisted strategy (absent when never configured) alongside the
        agent's live probe (absent until the agent has reported one).
      required:
        - strategy
        - probe
      properties:
        strategy:
          allOf:
            - $ref: '#/components/schemas/TelemtUpdateStrategy'
          nullable: true
        probe:
          allOf:
            - $ref: '#/components/schemas/TelemtUpdateProbe'
          nullable: true

    DispatchTelemtUpdateRequest:
      type: object
      description: |
        Body of `POST /api/agents/{id}/telemt/update`. Both fields are
        optional — an empty body dispatches the panel's cached latest known
        Telemt release with no downgrade allowance.
      properties:
        version:
          type: string
          description: |
            Target Telemt version (bare semver, e.g. "3.4.25"). Omit to use
            the panel's cached latest known Telemt release
            (`telemt_latest_version` in the updates state); a 409
            `no_known_release` is returned if neither is available.
        allow_downgrade:
          type: boolean
          description: |
            Allow installing a version older than the one currently
            running (e.g. an emergency rollback). Defaults to false.

    DispatchTelemtUpdateResponse:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string

    DispatchTelemtUpdateError:
      type: object
      description: |
        409 error envelope for `POST /api/agents/{id}/telemt/update`: `code`
        is the machine-readable guard that rejected the request.
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable message; safe to display to operators.
        code:
          type: string
          enum:
            - strategy_not_configured
            - mode_not_binary
            - update_unavailable
            - no_known_release
          description: |
            strategy_not_configured: no update strategy has been PUT for
            this agent yet. mode_not_binary: the configured strategy's mode
            is "docker" or "none" — no in-place binary swap path exists.
            update_unavailable: the agent's live probe reports it cannot
            offer an in-place update right now. no_known_release: no
            version was given and the panel has never cached a latest
            Telemt release.

    EnrollmentTokenList:
      type: array
      items:
        $ref: '#/components/schemas/EnrollmentTokenListItem'

    EnrollmentTokenListItem:
      type: object
      description: |
        Listing-safe view of an enrollment token. The raw `value` is
        intentionally absent — only the creation response surfaces
        the bearer secret. Use `handle` (SHA-256 prefix) to revoke.
      required:
        - panel_url
        - fleet_group_id
        - status
        - issued_at_unix
        - expires_at_unix
      properties:
        masked_value:
          type: string
          description: Truncated form of the raw value, ellipsis-suffixed.
        handle:
          type: string
          description: SHA-256 prefix of the raw value, hex-encoded.
        panel_url:
          type: string
        fleet_group_id:
          type: string
        status:
          type: string
          enum: [active, expired, consumed, revoked]
        issued_at_unix: { type: integer, format: int64 }
        expires_at_unix: { type: integer, format: int64 }
        consumed_at_unix:
          type: integer
          format: int64
          nullable: true
        revoked_at_unix:
          type: integer
          format: int64
          nullable: true

    CreateEnrollmentTokenRequest:
      type: object
      required: [ttl_seconds]
      properties:
        fleet_group_id:
          type: string
          description: |
            Either the canonical UUID or the friendly slug; empty
            string falls back to the default fleet group.
        ttl_seconds:
          type: integer
          minimum: 1
          description: Token lifetime in seconds.

    ScriptSource:
      type: object
      description: |
        Pointer to a hosted copy of the agent install script
        (`install-agent.sh`). Each source carries its own URL; the
        Panel-served copy also exports its SHA-256 so the operator
        client can render a tamper-resistant curl|sudo-bash form.
      required: [url]
      properties:
        url:
          type: string
          description: Fully-qualified HTTPS URL to install-agent.sh.
        sha256:
          type: string
          nullable: true
          description: |
            Lowercase hex SHA-256 of the script body. Populated for the
            Panel-served source (the panel knows the exact bytes it is
            serving); null for the GitHub-hosted fallback (no
            panel-side integrity guarantee — operators pin a release
            tag instead).

    ScriptSources:
      type: object
      description: |
        The two canonical sources from which an agent host can fetch
        the install script. Operators choose between them in the
        Add-Server wizard — Panel for the default inbound case (panel
        is reachable, integrity-checked), GitHub for outbound (panel
        is firewalled from the agent host) or cold-bootstrap.
      required: [panel, github]
      properties:
        panel:
          $ref: '#/components/schemas/ScriptSource'
        github:
          $ref: '#/components/schemas/ScriptSource'

    CreateEnrollmentTokenResponse:
      type: object
      description: |
        Response to a successful `POST /api/agents/enrollment-tokens`.
        The raw `value` is exposed once at this moment; subsequent
        listings only carry the masked form.
      required:
        - value
        - panel_url
        - fleet_group_id
        - issued_at_unix
        - expires_at_unix
        - ca_pem
        - script_sources
      properties:
        value:
          type: string
          description: The raw bootstrap token. Returned only at creation.
        panel_url:
          type: string
        fleet_group_id:
          type: string
        issued_at_unix: { type: integer, format: int64 }
        expires_at_unix: { type: integer, format: int64 }
        ca_pem:
          type: string
          description: PEM-encoded panel CA certificate.
        script_sources:
          $ref: '#/components/schemas/ScriptSources'

    RenameAgentRequest:
      type: object
      required: [node_name]
      properties:
        node_name:
          type: string
          minLength: 1

    UpdateAgentFleetGroupRequest:
      type: object
      required: [fleet_group_id]
      properties:
        fleet_group_id:
          type: string
          minLength: 1
          description: Target fleet-group UUID. Must already exist.

    UpdateAgentTransportModeRequest:
      type: object
      required: [transport_mode]
      properties:
        transport_mode:
          type: string
          enum: [inbound, outbound]
        dial_address:
          type: string
          description: |
            Public host:port the panel dials (required for outbound).
        listen_address:
          type: string
          description: |
            Agent-side bind spec. Optional — defaults to `:<port>`
            derived from `dial_address` when omitted.

    DispatchAgentUpdateRequest:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Target agent binary version.

    DispatchAgentUpdateResponse:
      type: object
      required: [job_id, status, version]
      properties:
        job_id:
          type: string
        status:
          type: string
          example: dispatched
        version:
          type: string

    InstallCommandAdvancedOptions:
      type: object
      description: |
        Optional per-install overrides — the wizard's "Advanced" section.
        All fields nullable / omittable so the default install (with the
        agent's built-in Telemt defaults) needs none of these.
      properties:
        telemt_url:
          type: string
          nullable: true
          description: Override the agent's Telemt API URL.
        telemt_metrics_url:
          type: string
          nullable: true
          description: Override the agent's Telemt metrics URL.
        telemt_auth:
          type: string
          nullable: true
          description: |
            Authorization header value (e.g. "Bearer xxx") the agent
            forwards to Telemt. Empty / omitted = no auth header.
        insecure_transport:
          type: boolean
          nullable: true
          description: |
            Opt-in: allow plain-HTTP panel URLs on non-loopback hosts.
            Intended for VPN-only / private-network deploys where the
            bootstrap-key handshake transits in cleartext.

    ProvisionOutboundAgentRequest:
      type: object
      required: [node_name, fleet_group_id, dial_address]
      properties:
        node_name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Operator-supplied display name. Must satisfy the same
            character class enforced for inbound enrollment
            (`[A-Za-z0-9._-]+`), since the value is interpolated into
            the curl|bash one-liner as a CLI flag value.
        fleet_group_id:
          type: string
          description: |
            Canonical fleet-group UUID or friendly slug. Empty string
            falls back to the operator's default fleet group.
        dial_address:
          type: string
          description: |
            Public host:port the panel dials to reach the agent. Used
            both for the agent's listen bind (derived port) and for
            the panel's outbound supervisor target.
          example: "203.0.113.10:8443"
        script_source:
          type: string
          enum: [panel, github]
          default: github
          description: |
            Source from which the agent host fetches install-agent.sh.
            'github' is the default for outbound because the panel is
            typically firewalled from the agent host (otherwise the
            operator would use inbound mode); 'panel' is supported for
            cases where the agent can reach the panel during bootstrap
            even though the steady-state transport is reverse.
        advanced:
          $ref: '#/components/schemas/InstallCommandAdvancedOptions'

    ProvisionOutboundAgentResponse:
      type: object
      description: |
        Returned by `POST /api/agents/provision-outbound`: the install
        one-liner and its expiry, plus the freshly-minted agent_id so the
        wizard can poll `GET /api/agents/{id}` for the first connection
        and call `DELETE /api/agents/{id}` on cancel.
      required: [agent_id, command, expires_at_unix, script_url]
      properties:
        agent_id:
          type: string
        command:
          type: string
          description: Pre-baked `curl ... | sudo bash -s -- ...` one-liner.
        expires_at_unix:
          type: integer
          format: int64
        script_url:
          type: string
          description: |
            The URL the curl in the command points at — exposed so the
            wizard can show the operator which source was used.

    CreateCertificateRecoveryGrantRequest:
      type: object
      properties:
        ttl_seconds:
          type: integer
          minimum: 0
          description: |
            Grant lifetime in seconds. Zero or omitted yields the
            server's default TTL (15m, capped at 1h).

    SelfUpdateState:
      type: object
      description: |
        Server-side lifecycle of the current or most-recent panel
        self-update run, persisted across restarts. `phase` is the
        source of truth for whether an update is in progress: the empty
        string means idle (no run started, or nothing to show).
        `completed` and `failed` are terminal; on `failed`, `message`
        carries the operator-readable reason. The dashboard reads this so
        an in-flight update survives a page reload and always resolves to
        a terminal outcome.
      required: [phase]
      properties:
        phase:
          type: string
          enum: ["", downloading, installing, restart_pending, completed, failed]
        from_version:
          type: string
        to_version:
          type: string
        message:
          type: string
        updated_at:
          type: integer
          format: int64
          description: Unix seconds of the last phase transition.

    ApplyAccepted:
      type: object
      description: |
        202 body returned by the async config-apply handlers (single
        agent and group fan-out). Mirrors the Go
        `groupApplyAcceptedResponse` struct
        (`internal/controlplane/server/http_config_apply.go`). Poll the
        corresponding `.../config/apply/batches/{batchId}` endpoint for
        status.
      required: [batch_id]
      properties:
        batch_id:
          type: string

    ConfigDrift:
      type: object
      description: |
        Drift summary attached to a config GET response. `fields` lists
        the dotted paths that drift; it is empty unless `status` is
        `drifted`.
      required: [status, fields]
      properties:
        status:
          type: string
          enum: [in_sync, drifted, unknown]
        fields:
          type: array
          items:
            type: string

    AgentConfigResponse:
      type: object
      description: |
        GET /api/agents/{id}/config response. Mirrors the Go
        `agentConfigTargetResponse` struct
        (`internal/controlplane/server/http_config_targets.go`).
        `desired` is the agent's own stored config snapshot (stripped
        of the internal schema-version marker), `effective` is the
        fleet-group sections deep-merged with `desired`, `observed` is
        the node's last-reported editable sections, `drift`
        compares `desired` against `observed`, and `group_paths` lists
        the flattened dotted paths the node's fleet group governs (so
        the UI can lock those fields).
      required: [desired, effective, observed, drift, group_paths]
      properties:
        desired:
          type: object
          additionalProperties: true
        effective:
          type: object
          additionalProperties: true
        observed:
          type: object
          additionalProperties: true
        drift:
          $ref: '#/components/schemas/ConfigDrift'
        group_paths:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Caller is not authenticated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller is authenticated but lacks the required role/scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource does not exist or is out-of-scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: panvex_session
      description: |
        Server-issued session cookie set by `POST /api/login`. Marked
        Secure + HttpOnly + SameSite=Lax in production; the bare
        non-prefixed name above is the dev fallback for plain-HTTP
        loopback (the production runtime sets `__Host-panvex_session`
        instead — same auth flow, different cookie attribute set).

security:
  - sessionCookie: []
