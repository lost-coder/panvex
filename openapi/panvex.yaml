# Panvex control-plane public API — OpenAPI 3.0.3 source of truth.
#
# Wave 3.3 — see docs/superpowers/plans/2026-05-08-api-codegen.md
# for the migration plan. Currently covers the trivial pilots
# (/healthz, /api/version) plus the /api/agents/* route group; future
# PRs add /api/clients/*, /api/jobs/*, etc. one group at a time.
#
# Generation:
#   make gen-openapi          # regenerate Go server + TypeScript types
#   make verify-openapi       # CI: assert generated outputs are in sync
#
# Tools (installed via `make install-tools`):
#   - oapi-codegen v2 (chi-server mode)
#   - openapi-typescript

openapi: 3.0.3

info:
  title: Panvex Control Plane API
  description: |
    Operator-facing HTTP API for the Panvex fleet management
    control-plane. Migrated incrementally from hand-rolled Zod
    schemas; consult `web/src/shared/api/schemas/` for endpoints not
    yet covered here.
  version: "1.0.0-pre"
  contact:
    name: Panvex maintainers
    url: https://github.com/lost-coder/panvex

servers:
  - url: /
    description: Same-origin (the panel serves both API and UI)

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: |
        Returns 200 OK when the HTTP server is accepting connections.
        Plain `text/plain` body containing the literal string `ok` —
        kept text rather than JSON so kubelet's default probe parser
        doesn't have to recurse JSON.
      security: []  # unauthenticated probe
      responses:
        '200':
          description: Service is alive.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/version:
    get:
      operationId: getVersion
      summary: Panel build identification
      description: |
        Returns the running panel's build metadata. Operator+ callers
        also get `commit_sha` and `build_time`; viewer-role responses
        carry only `version`.
      responses:
        '200':
          description: Panel build info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/agents:
    get:
      operationId: listAgents
      summary: List enrolled agents in operator's fleet scope
      description: |
        Returns every agent the calling operator can see, filtered by
        their fleet-group scope (R-S-14). Each entry carries the live
        runtime snapshot the panel last received plus optional
        certificate recovery state.
      tags: [agents]
      responses:
        '200':
          description: Agent inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/agents/enrollment-tokens:
    get:
      operationId: listEnrollmentTokens
      summary: List enrollment tokens visible to the operator
      description: |
        Returns every enrollment token whose fleet-group sits within
        the caller's scope (R-S-14). Raw token values are masked —
        only the creation response surfaces the bearer secret. Use
        `handle` to revoke without exposing the raw value.
      tags: [agents, enrollment]
      responses:
        '200':
          description: Token list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTokenList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createEnrollmentToken
      summary: Mint a new enrollment token
      description: |
        Issues a one-time bootstrap token for an agent to enroll into
        the named fleet group. The raw `value` is returned ONLY here;
        listing endpoints expose only a masked form afterwards.
      tags: [agents, enrollment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentTokenRequest'
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEnrollmentTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/agents/enrollment-tokens/{value}/revoke:
    parameters:
      - name: value
        in: path
        required: true
        description: |
          Either the raw token value or the stable handle (SHA-256
          prefix) returned in the listing payload. Both forms resolve
          to the same persistent record.
        schema:
          type: string
    post:
      operationId: revokeEnrollmentToken
      summary: Revoke an enrollment token
      description: |
        Marks the token as revoked so subsequent bootstrap attempts
        fail. Idempotent — revoking an already-revoked token returns
        204 without an audit event.
      tags: [agents, enrollment]
      responses:
        '204':
          description: Token revoked (or already revoked).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Agent UUID.
        schema:
          type: string
    patch:
      operationId: renameAgent
      summary: Rename an agent's display node-name
      description: |
        Updates the operator-facing label only; the agent's UUID and
        certificate identity are unaffected. Idempotent (no audit
        event when the new name equals the existing one).
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameAgentRequest'
      responses:
        '200':
          description: Updated agent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deregisterAgent
      summary: Deregister an agent
      description: |
        Terminates the agent's gRPC session, deletes its persistent
        records (instances, recovery grants), and adds the agent ID
        to the in-memory revocation list so a reconnect with valid
        mTLS material is rejected at Connect time.
      tags: [agents]
      responses:
        '204':
          description: Agent deregistered.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{id}/fleet-group:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateAgentFleetGroup
      summary: Reassign an agent to a different fleet group
      description: |
        Operator must be scoped over BOTH the current and target
        groups. No-op responses (existing == target) are returned
        with the current agent shape so the client can refresh
        without a special-cased branch.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentFleetGroupRequest'
      responses:
        '200':
          description: Agent reassigned (or no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{id}/update:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: dispatchAgentUpdate
      summary: Enqueue a self-update job for an agent
      description: |
        Schedules an `agent_self_update` job carrying the resolved
        binary asset metadata. The agent picks it up via its
        long-poll session.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchAgentUpdateRequest'
      responses:
        '200':
          description: Update job dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchAgentUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{id}/transport-mode:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateAgentTransportMode
      summary: Switch an agent between inbound and outbound transport
      description: |
        Persists the new transport mode in the DB, enqueues a
        `switch_transport_mode` job, and notifies the in-process
        transport manager so outbound supervisors are spawned or
        torn down immediately. `dial_address` is required when
        switching to outbound; the agent's listen-bind defaults
        to `:<port>` derived from `dial_address` when
        `listen_address` is omitted.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentTransportModeRequest'
      responses:
        '204':
          description: Mode updated and job dispatched.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{id}/telemt/update-strategy:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTelemtUpdateStrategy
      summary: Get an agent's Telemt update strategy and live probe
      description: |
        Returns the persisted update strategy for the agent (`null` when
        never configured) alongside its live-reported probe (`null` until
        the agent has sent at least one snapshot carrying it — see
        `Agent.telemt_update_probe`), so the dashboard can render "not
        configured yet, but here's what we detected" in one round trip.
      tags: [agents]
      responses:
        '200':
          description: Strategy and probe for the agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemtUpdateStrategyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putTelemtUpdateStrategy
      summary: Set an agent's Telemt update strategy
      description: |
        Persists how `telemt.update` jobs should apply on this agent:
        `mode` is one of `binary` (a supported process supervisor fronts
        telemt; a binary swap + supervised restart is safe), `docker`
        (updates must go through the image), or `none`. For
        `mode: binary`, `restart_spec` (validated with the same rules the
        agent applies) and an absolute `binary_path` are required.
        Admin-only.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemtUpdateStrategy'
      responses:
        '204':
          description: Strategy saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{id}/telemt/update:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: dispatchTelemtUpdate
      summary: Enqueue a telemt.update job for an agent's managed Telemt install
      description: |
        Schedules a `telemt.update` job that downloads, verifies, and swaps
        the agent's MANAGED Telemt binary in place (distinct from
        `POST /api/agents/{id}/update`, which replaces the AGENT's own
        binary), then runs a supervised restart per the agent's configured
        update strategy (`PUT /api/agents/{id}/telemt/update-strategy`).
        `version` defaults to the panel's cached latest known Telemt
        release when omitted. A guard chain (see `DispatchTelemtUpdateError`)
        rejects the request with 409 before enqueueing when the strategy is
        unconfigured, does not support a binary swap, the agent's live probe
        reports the update as unavailable, or no version is known — checked
        in that order. Admin-only, same trust bar as the update-strategy
        endpoints.
      tags: [agents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchTelemtUpdateRequest'
      responses:
        '202':
          description: Update job dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchTelemtUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The update cannot be dispatched right now — see `code` in the
            response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchTelemtUpdateError'

  /api/agents/provision-outbound:
    post:
      operationId: provisionOutboundAgent
      summary: Create an outbound agent and return its install command
      description: |
        One-call provisioning for outbound (reverse-mode) agents: inserts
        the agent row, issues a 5-minute bootstrap token, and returns the
        pre-baked `curl ... | sudo bash` one-liner the operator pastes on
        the agent host. Combines what would otherwise be `POST /agents`
        (no such endpoint today) and the bootstrap-token issuance into a
        single round-trip, mirroring the simplicity of the inbound
        `POST /agents/enrollment-tokens` flow.

        Cancellation: if the operator backs out of the wizard before
        running the command, the frontend should call
        `DELETE /api/agents/{id}` (admin) to remove the orphan row. A
        nightly sweep also prunes rows whose `bootstrap_expires_at` has
        elapsed without a first connection.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionOutboundAgentRequest' }
      responses:
        '201':
          description: Agent provisioned, install command issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionOutboundAgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: node_name already in use within this fleet group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Install-command endpoint not configured.
          content:
            text/plain:
              schema:
                type: string

  /api/agents/{id}/certificate-recovery-grants:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createAgentCertificateRecoveryGrant
      summary: Allow an agent to recover an expired certificate
      description: |
        Admins issue a time-bounded grant so an agent whose mTLS
        certificate has expired can present a proof-of-possession
        and receive a fresh certificate without re-enrolling.
      tags: [agents, recovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificateRecoveryGrantRequest'
      responses:
        '201':
          description: Grant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCertificateRecoveryGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{id}/certificate-recovery-grants/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: revokeAgentCertificateRecoveryGrant
      summary: Revoke a previously-issued recovery grant
      description: |
        Marks the agent's recovery grant as revoked so a stale grant
        cannot be redeemed. Returns the updated grant snapshot.
      tags: [agents, recovery]
      responses:
        '200':
          description: Grant revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCertificateRecoveryGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{id}/config:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAgentConfig
      summary: Get an agent's desired config snapshot, effective merge, observed config, and drift
      description: |
        Returns the agent's own desired config snapshot (the full
        stored config target, stripped of the internal schema-version
        marker), the fleet-group ⊕ desired effective merge (used to
        mark locked/group-owned fields in the UI), the node's
        last-observed editable sections, and the drift between the
        desired snapshot and what was last observed.
      tags: [agents]
      responses:
        '200':
          description: Agent config snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{id}/config/apply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: applyAgentConfig
      summary: Apply the effective config target to a single agent
      description: |
        Enqueues a config.apply job for the agent's effective config
        target (fleet-group sections deep-merged with its own
        desired snapshot) as a persistent batch-of-one and returns
        immediately with a batch id to poll. The optional body lets
        the operator choose the reload session policy (instant vs.
        drain) the agent's Maestro reload uses, and optionally
        restrict the push to a specific set of dotted config paths
        (e.g. pushing a single field the operator just edited rather
        than every drifted leaf); an absent body defaults to a 30s
        drain window and no path restriction.
      tags: [agents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reload_mode:
                  type: string
                  enum: [instant, drain]
                reload_timeout_secs:
                  type: integer
                  minimum: 1
                  maximum: 3600
                paths:
                  type: array
                  items:
                    type: string
                  description: >-
                    Optional dotted config paths to restrict the apply
                    to. Absent or empty pushes every drifted leaf.
      responses:
        '202':
          description: Apply accepted; poll the batch endpoint for status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/fleet-groups/{id}/config/apply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: applyGroupConfig
      summary: Apply the effective config target to every in-scope agent in a fleet group
      description: |
        Enqueues one config.apply job per in-scope agent and returns
        immediately with a batch id to poll (progress is observed via
        the batch-status endpoint, not blocked on here). The optional
        body lets the operator choose the reload session policy
        (instant vs. drain) each agent's Maestro reload uses; an
        absent body defaults to a 30s drain window.
      tags: [fleet-groups]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reload_mode:
                  type: string
                  enum: [instant, drain]
                reload_timeout_secs:
                  type: integer
                  minimum: 1
                  maximum: 3600
      responses:
        '202':
          description: Apply accepted; poll the batch endpoint for status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    VersionResponse:
      type: object
      description: Build metadata for the running control-plane process.
      required: [version]
      properties:
        version:
          type: string
          description: Semantic version (or "dev" for unstamped builds).
          example: 1.4.7
        commit_sha:
          type: string
          description: Git commit hash baked in at build time. Operator+ only.
        build_time:
          type: string
          format: date-time
          description: RFC3339 build timestamp. Operator+ only.

    Error:
      type: object
      description: Standard error envelope used by every 4xx / 5xx response.
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code (e.g. `not_found`, `forbidden`).
        message:
          type: string
          description: Human-readable message; safe to display to operators.
        details:
          type: object
          description: Optional structured context. Shape varies per error code.
          additionalProperties: true

    Agent:
      type: object
      description: |
        Control-plane snapshot of one enrolled agent. Mirrors the Go
        `server.Agent` struct (`internal/controlplane/server/types.go`).
      required:
        - id
        - node_name
        - fleet_group_id
        - version
        - read_only
        - presence_state
        - runtime
        - last_seen_at
      properties:
        id:
          type: string
          description: Agent UUID.
        node_name:
          type: string
          description: Operator-facing display name.
        fleet_group_id:
          type: string
          description: UUID of the fleet group the agent belongs to.
        version:
          type: string
          description: Agent binary semver as last reported.
        read_only:
          type: boolean
          description: True when the agent serves read-only Telemt instances.
        presence_state:
          type: string
          description: |
            Live presence evaluation — `online`, `flapping`, `offline`, etc.
            Computed at request time from session + heartbeat data.
        transport_reconnect_pending:
          type: boolean
          description: |
            True when the agent was switched to outbound transport but the
            panel has not accepted a session from/to it since the switch
            ("switched but never reconnected"). Cleared on the next accepted
            agent stream.
        transport_drift:
          type: boolean
          description: |
            True when the direction of the last accepted stream disagreed with
            dial_transport_mode — the agent is still dialing IN while the DB
            says outbound, or vice versa (R-4). The panel re-enqueues the
            switch job to converge; cleared once a session connects in the
            direction the DB expects.
        bootstrap_state:
          type: string
          description: |
            Enrollment lifecycle state of the agents row: "pending"
            (provisioned, awaiting first enrollment), "expired" (bootstrap
            token lapsed before enrollment) or "active" (enrolled). Empty for
            legacy inbound rows. Meaningful for the UI only while the node has
            never connected — a half-added node renders as pending/expired
            instead of offline (R9a).
        dial_transport_mode:
          type: string
          description: |
            Persisted transport mode of the agents row — "inbound" (agent
            dials the panel) or "outbound" (panel dials the agent). Distinct
            from runtime.transport_mode (Telemt classic/middle_proxy).
        certificate_recovery:
          allOf:
            - $ref: '#/components/schemas/AgentCertificateRecoveryGrant'
          description: |
            Optional snapshot of any active certificate-recovery grant
            for the agent. Absent when no grant has been issued.
        cert_issued_at:
          type: string
          format: date-time
          description: Issuance timestamp of the agent's current certificate.
        cert_expires_at:
          type: string
          format: date-time
          description: Expiry timestamp of the agent's current certificate.
        telemt_update_probe:
          allOf:
            - $ref: '#/components/schemas/TelemtUpdateProbe'
          description: |
            Whether (and how) this node's telemt install can be updated
            in place: which process supervisor fronts it, and — when no
            in-place path exists — why. Cached by the agent once at
            process startup and stamped on every snapshot; absent until
            the agent has sent at least one such snapshot (older agents
            that predate the probe never populate it).
        runtime:
          $ref: '#/components/schemas/AgentRuntime'
        last_seen_at:
          type: string
          format: date-time
          description: Last successful heartbeat timestamp.

    AgentList:
      type: array
      description: List response from `GET /api/agents`.
      items:
        $ref: '#/components/schemas/Agent'

    AgentRuntime:
      type: object
      description: |
        Telemt operator overview reported by the agent. The set of
        fields is defensive on the Zod side because backends can ship
        new counters without an immediate web release; on the spec
        side we list every field the panel currently consumes.
      required:
        - accepting_new_connections
        - me_runtime_ready
        - me2dc_fallback_enabled
        - use_middle_proxy
        - startup_status
        - startup_stage
        - startup_progress_pct
        - initialization_status
        - degraded
        - initialization_stage
        - initialization_progress_pct
        - transport_mode
        - current_connections
        - current_connections_me
        - current_connections_direct
        - active_users
        - uptime_seconds
        - connections_total
        - connections_bad_total
        - handshake_timeouts_total
        - configured_users
        - dc_coverage_pct
        - healthy_upstreams
        - total_upstreams
        - fail_rate_pct_5m
        - fail_rate_known
        - connect_attempt_total
        - connect_success_total
        - connect_fail_total
        - connect_failfast_total
        - dcs
        - upstreams
        - recent_events
        - system_load
        - telemt_unreachable
        - telemt_unreachable_since_unix
        - user_telemetry_suppressed
        - updated_at
      properties:
        accepting_new_connections: { type: boolean }
        me_runtime_ready: { type: boolean }
        me2dc_fallback_enabled: { type: boolean }
        use_middle_proxy: { type: boolean }
        startup_status: { type: string }
        startup_stage: { type: string }
        startup_progress_pct: { type: number, format: double }
        initialization_status: { type: string }
        degraded: { type: boolean }
        lifecycle_state: { type: string }
        initialization_stage: { type: string }
        initialization_progress_pct: { type: number, format: double }
        transport_mode: { type: string }
        current_connections: { type: integer }
        current_connections_me: { type: integer }
        current_connections_direct: { type: integer }
        active_users: { type: integer }
        uptime_seconds: { type: number, format: double }
        connections_total: { type: integer, format: int64, minimum: 0 }
        connections_bad_total: { type: integer, format: int64, minimum: 0 }
        connections_bad_by_class:
          type: array
          nullable: true
          description: |
            Per-class breakdown of bad connections (Telemt 3.4.10+). The
            class set is open-ended. Backend emits `null` (not `[]`) when
            no breakdown has been observed yet — absence means "unknown".
          items:
            $ref: '#/components/schemas/ConnectionClassCount'
        handshake_failures_by_class:
          type: array
          nullable: true
          description: |
            Per-class breakdown of handshake failures (Telemt 3.4.10+).
            Same null-vs-empty semantics as connections_bad_by_class.
          items:
            $ref: '#/components/schemas/ConnectionClassCount'
        handshake_timeouts_total: { type: integer, format: int64, minimum: 0 }
        configured_users: { type: integer }
        dc_coverage_pct: { type: number, format: double }
        healthy_upstreams: { type: integer }
        total_upstreams: { type: integer }
        # Per-route-kind upstream counts (Telemt 3.4.7+, surfaced through
        # the gateway). Optional: older agents / Telemt versions don't
        # report them, so the panel falls back to counting the upstream
        # rows. The Go struct emits them without omitempty, but leaving
        # them out of `required` keeps the panel backward-compatible.
        unhealthy_upstreams: { type: integer, minimum: 0 }
        direct_upstreams: { type: integer, minimum: 0 }
        socks4_upstreams: { type: integer, minimum: 0 }
        socks5_upstreams: { type: integer, minimum: 0 }
        shadowsocks_upstreams: { type: integer, minimum: 0 }
        fail_rate_pct_5m:
          type: number
          format: double
          description: |
            5-minute upstream connect fail-rate. Read together with
            `fail_rate_known`: `false` means "unknown", not "0%".
        fail_rate_known: { type: boolean }
        connect_attempt_total: { type: integer, format: int64, minimum: 0 }
        connect_success_total: { type: integer, format: int64, minimum: 0 }
        connect_fail_total: { type: integer, format: int64, minimum: 0 }
        connect_failfast_total: { type: integer, format: int64, minimum: 0 }
        fallback_entered_at_unix:
          type: integer
          format: int64
          nullable: true
          description: |
            Unix timestamp the panel observed this agent enter
            ME→DC fallback. Absent when not in fallback.
        reroute_active: { type: boolean }
        route_mode: { type: string }
        me2dc_fast_enabled: { type: boolean }
        stale_cache_used: { type: boolean }
        top_by_connections:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeTopByConnections'
        top_by_throughput:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeTopByThroughput'
        dcs:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeDC'
        upstreams:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeUpstream'
        recent_events:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeEvent'
        system_load:
          $ref: '#/components/schemas/RuntimeSystemLoad'
        me_writers_summary:
          $ref: '#/components/schemas/RuntimeMeWritersSummary'
        telemt_unreachable: { type: boolean }
        telemt_unreachable_since_unix: { type: integer, format: int64 }
        # True when Telemt is not emitting per-user series (user telemetry
        # switched off, or the 4096-user labeled-series cap truncated them):
        # per-client traffic and quota usage for this node are stale or zero.
        # Warning only — does not affect node status. False is healthy.
        user_telemetry_suppressed: { type: boolean }
        updated_at:
          type: string
          format: date-time

    RuntimeEvent:
      type: object
      required: [sequence, timestamp_unix, event_type, context]
      properties:
        sequence: { type: integer, format: int64, minimum: 0 }
        timestamp_unix: { type: integer, format: int64 }
        event_type: { type: string }
        context: { type: string }

    RuntimeDC:
      type: object
      required:
        - dc
        - available_endpoints
        - available_pct
        - required_writers
        - alive_writers
        - coverage_pct
        - fresh_alive_writers
        - fresh_coverage_pct
        - rtt_ms
        - load
      properties:
        dc: { type: integer }
        available_endpoints: { type: integer }
        available_pct: { type: number, format: double }
        required_writers: { type: integer }
        alive_writers: { type: integer }
        coverage_pct: { type: number, format: double }
        fresh_alive_writers: { type: integer }
